openapi: 3.1.0

info:
  title: Sync API
  version: 1.0.0
  summary: Meet only when you're invited.
  description: |
    Sync is an authorization engine with meeting features around it.

    A join credential is a **revocable, participant-bound, time-bound
    authorization**, and its validity is re-evaluated against current server
    state on every protected operation. A successful join grants no lasting
    permission: the next heartbeat, the next token replay and the next
    transcript read are each authorized from scratch.

    **Authentication** is a Better Auth session cookie (HttpOnly, SameSite=Lax,
    Secure in production). The server resolves the user from that session on
    every request. A client-supplied user ID, organizer ID or role is never
    trusted.

    **Window semantics** are `start` inclusive, `end` exclusive, evaluated
    against server time:
    `09:00:00.000` allowed, `09:59:59.999` allowed, `10:00:00.000` denied.

    **Anti-discovery**: where a caller has no relationship to a call, the API
    answers as though the call did not exist, so call-ID guessing reveals
    nothing.

servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Auth
    description: Session handling, served by Better Auth at /api/auth/*
  - name: Users
  - name: Calls
  - name: Invitations
  - name: Join
    description: The critical path — authorize, heartbeat, leave
  - name: Attendance
  - name: Transcripts
  - name: Audit
  - name: Operations

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: |
        HttpOnly session cookie issued by Better Auth. Cookie presence alone
        proves nothing; the session is validated server-side on every request.

  parameters:
    callId:
      name: callId
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    invitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    joinToken:
      name: token
      in: path
      required: true
      description: |
        The raw opaque invitation credential. Only its SHA-256 hash is stored
        server-side. It is never logged, audited or returned by any read
        endpoint.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{32,256}$' }
    cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from a previous response's `nextCursor`.
      schema: { type: string, maxLength: 512 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                [AUTHENTICATION_REQUIRED, FORBIDDEN, VALIDATION_ERROR, CALL_NOT_FOUND,
                 CALL_NOT_JOINABLE, CALL_CANCELLED, INVITE_NOT_FOUND, INVITE_REVOKED,
                 INVITE_EXPIRED, PARTICIPANT_MISMATCH, JOIN_WINDOW_NOT_OPEN,
                 JOIN_WINDOW_CLOSED, TRANSCRIPT_NOT_READY, TRANSCRIPT_ACCESS_DENIED,
                 PROVIDER_UNAVAILABLE, RATE_LIMITED, CONFLICT, BUSINESS_RULE_FAILURE,
                 RESOURCE_NOT_FOUND, INTERNAL_ERROR]
            message: { type: string }
            requestId: { type: string }
            details: { type: array, items: { type: object } }

    Call:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        scheduledStart: { type: string, format: date-time }
        scheduledEnd: { type: string, format: date-time }
        timezone: { type: string, example: Asia/Kolkata }
        status: { type: string, enum: [DRAFT, SCHEDULED, LIVE, ENDED, CANCELLED] }
        organizerId: { type: string }
        createdAt: { type: string, format: date-time }

    Invitation:
      type: object
      description: Never carries `tokenHash` — the field does not exist on this type.
      properties:
        id: { type: string }
        callId: { type: string }
        participantId: { type: string }
        participant:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string, format: email }
        status: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }

    CreatedInvitation:
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          properties:
            joinUrl:
              type: string
              description: |
                Contains the raw credential. Returned **only here, only once**.
                Treat it as a secret: it is not recoverable from any other
                endpoint and must not be logged or stored in analytics.

    Attendance:
      type: object
      description: One logical record per participant per call, with one session per device.
      properties:
        id: { type: string }
        callId: { type: string }
        participantId: { type: string }
        firstJoinedAt: { type: [string, 'null'], format: date-time }
        lastLeftAt: { type: [string, 'null'], format: date-time }
        totalConnectedSeconds:
          type: integer
          description: |
            The UNION of device session intervals, not their sum. Two devices
            overlapping 10:00-10:40 and 10:20-10:50 yield 50 minutes, not 70.
        status: { type: string, enum: [NOT_JOINED, ACTIVE, COMPLETED] }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/AttendanceSession' }

    AttendanceSession:
      type: object
      properties:
        id: { type: string }
        deviceId: { type: string }
        joinedAt: { type: string, format: date-time }
        leftAt: { type: [string, 'null'], format: date-time }
        leftReason: { type: [string, 'null'] }
        status:
          type: string
          enum: [CONNECTED, LEFT, REVOKED, WINDOW_CLOSED, CALL_ENDED, DISCONNECTED]

    Transcript:
      type: object
      properties:
        callId: { type: string }
        status: { type: string, enum: [PENDING, PROCESSING, READY, FAILED, DELETED] }
        content: { type: string, description: Present only when status is READY. }
        generatedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }

    AuditEvent:
      type: object
      properties:
        id: { type: string }
        action: { type: string, example: INVITATION_REVOKED }
        outcome: { type: string, enum: [SUCCESS, DENIED, FAILURE] }
        actorUserId: { type: [string, 'null'] }
        invitationId: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
        metadata:
          type: [object, 'null']
          description: Sanitized. Never contains tokens, cookies, headers or transcript content.
        createdAt: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: AUTHENTICATION_REQUIRED, message: Authentication is required., requestId: req_abc }
    Forbidden:
      description: Authenticated, but not permitted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: |
        Missing — or present but unrelated to the caller. The two are
        deliberately indistinguishable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Rejected before any business logic ran.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - sessionCookie: []

paths:
  /health:
    get:
      tags: [Operations]
      summary: Liveness
      description: Does no I/O. Answers only "is this process up?".
      security: []
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              example: { status: ok }

  /ready:
    get:
      tags: [Operations]
      summary: Readiness
      description: Checks PostgreSQL and Redis. Never exposes connection details.
      security: []
      responses:
        '200':
          description: Dependencies reachable.
          content:
            application/json:
              example:
                status: ready
                dependencies: { postgres: up, redis: up }
        '503':
          description: A dependency is unreachable.

  /api/auth/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Auth]
      summary: Better Auth handler (sign-up, sign-in, sign-out, session)
      description: |
        Better Auth owns authentication internals. Relevant routes:
        `POST /api/auth/sign-up/email`, `POST /api/auth/sign-in/email`,
        `POST /api/auth/sign-out`, `GET /api/auth/get-session`.
        Rate limited independently of the rest of the API.
      security: []
      responses:
        '200': { description: Handled by Better Auth. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: The current session user
      responses:
        '200':
          description: The caller's own profile.
          content:
            application/json:
              example: { data: { id: user_alice, email: alice@example.com, name: Alice } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/users/lookup:
    get:
      tags: [Users]
      summary: Resolve a user by exact email
      description: Exact match only, so the endpoint cannot be used to enumerate users.
      parameters:
        - { name: email, in: query, required: true, schema: { type: string, format: email } }
      responses:
        '200': { description: The matching user, or null. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/calls:
    post:
      tags: [Calls]
      summary: Schedule a call
      description: |
        **Authorization**: any authenticated user. The caller becomes the
        organizer; an `organizerId` in the body is ignored.
        Writes a `CALL_CREATED` audit event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, scheduledStart, scheduledEnd, timezone]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                scheduledStart: { type: string, format: date-time }
                scheduledEnd: { type: string, format: date-time }
                timezone: { type: string, description: IANA zone, validated against host ICU data. }
            example:
              title: Security Architecture Review
              scheduledStart: '2026-09-22T10:00:00Z'
              scheduledEnd: '2026-09-22T11:00:00Z'
              timezone: Asia/Kolkata
      responses:
        '201':
          description: Created.
          content:
            application/json:
              example:
                data:
                  id: call_123
                  title: Security Architecture Review
                  scheduledStart: '2026-09-22T10:00:00.000Z'
                  scheduledEnd: '2026-09-22T11:00:00.000Z'
                  timezone: Asia/Kolkata
                  status: SCHEDULED
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    get:
      tags: [Calls]
      summary: List the caller's calls
      description: |
        **Authorization**: scoped to the caller. Cursor paginated at the
        database; no unbounded reads.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, SCHEDULED, LIVE, ENDED, CANCELLED] } }
        - { name: startAfter, in: query, schema: { type: string, format: date-time } }
        - { name: startBefore, in: query, schema: { type: string, format: date-time } }
        - { name: role, in: query, schema: { type: string, enum: [organizer, participant, any], default: organizer } }
      responses:
        '200':
          description: A page of calls, newest scheduled start first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Call' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/calls/{callId}:
    parameters: [{ $ref: '#/components/parameters/callId' }]
    get:
      tags: [Calls]
      summary: Read a call
      description: '**Authorization**: organizer or invited participant. Anyone else gets 404.'
      responses:
        '200':
          description: The call.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Call' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/calls/{callId}/cancel:
    parameters: [{ $ref: '#/components/parameters/callId' }]
    post:
      tags: [Calls]
      summary: Cancel a call
      description: |
        **Authorization**: organizer only.
        Invitation rows are left untouched so audit history stays intact —
        authorization then rejects on `CALL_CANCELLED`. Connected sessions are
        closed in the same transaction.
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Call' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already cancelled. }
        '422': { description: The call has already ended. }

  /api/v1/calls/{callId}/end:
    parameters: [{ $ref: '#/components/parameters/callId' }]
    post:
      tags: [Calls]
      summary: End a live call
      description: |
        **Authorization**: organizer only. Idempotent. Closes connected
        sessions and enqueues transcript generation. The clock-driven
        lifecycle worker performs the same transition automatically.
      responses:
        '200':
          description: Ended.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Call' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/calls/{callId}/invitations:
    parameters: [{ $ref: '#/components/parameters/callId' }]
    post:
      tags: [Invitations]
      summary: Invite a participant
      description: |
        **Authorization**: organizer only, derived
        `current user -> call -> organizer`.

        Generates a cryptographically random opaque token, stores only its
        SHA-256 hash, and returns the raw join URL in this response and nowhere
        else. Credential lifetime is clamped to the call window plus the
        configured grace period.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId]
              properties:
                participantId: { type: string }
                expiresAt:
                  type: string
                  format: date-time
                  description: Optional; clamped down to the window ceiling, never up.
            example: { participantId: user_alice }
      responses:
        '201':
          description: Invitation issued.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/CreatedInvitation' } }
              example:
                data:
                  id: inv_123
                  participantId: user_alice
                  status: ACTIVE
                  joinUrl: https://app.example.com/join/<opaque-token>
        '400': { description: Participant does not exist, or the payload is invalid. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: This participant is already invited to this call. }
        '422': { description: The organizer cannot invite themselves; the call is cancelled or ended. }

    get:
      tags: [Invitations]
      summary: List invitations for a call
      description: '**Authorization**: organizer only. Cursor paginated.'
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] } }
      responses:
        '200':
          description: A page of invitations. Never includes token material.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/invitations/{invitationId}:
    parameters: [{ $ref: '#/components/parameters/invitationId' }]
    get:
      tags: [Invitations]
      summary: Read an invitation
      description: '**Authorization**: the owning organizer, or its own participant.'
      responses:
        '200':
          description: The invitation.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Invitation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/invitations/{invitationId}/revoke:
    parameters: [{ $ref: '#/components/parameters/invitationId' }]
    post:
      tags: [Invitations]
      summary: Revoke an invitation
      description: |
        **Authorization**: organizer of the owning call only.

        Transactional and idempotent. The transaction takes a row lock before
        reading status, so once it commits **no concurrent join can still
        admit the invitation**. Connected sessions are terminated in the same
        transaction.

        Provider-side teardown happens strictly after commit and is retried by
        a queue. A provider failure never un-revokes application access.

        A second revoke returns 200 with the original `revokedAt` and writes no
        additional audit event.
      responses:
        '200':
          description: Revoked (or already revoked).
          content:
            application/json:
              example:
                data: { invitationId: inv_123, status: REVOKED, revokedAt: '2026-09-22T10:31:25.000Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/join/{token}/authorize:
    parameters: [{ $ref: '#/components/parameters/joinToken' }]
    post:
      tags: [Join]
      summary: Authorize and join
      description: |
        **Authorization** — all of the following, evaluated in order against
        current server state:
        authenticated user, invitation exists, call exists, invitation ACTIVE,
        invitation not expired, caller *is* the invited participant, call not
        cancelled/ended, and current server time inside `[start, end)`.

        Holding the token is never sufficient; the session must belong to the
        invited participant.

        Flow: authorize under a row lock, issue the provider session outside
        any transaction, then **re-authorize under a row lock** before
        recording attendance — a revoke landing during the provider round-trip
        still wins.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  description: Distinguishes concurrent devices for one participant.
      responses:
        '200':
          description: Admitted.
          content:
            application/json:
              example:
                data:
                  call:
                    id: call_123
                    title: Architecture Review
                    scheduledStart: '2026-09-22T09:00:00.000Z'
                    scheduledEnd: '2026-09-22T10:00:00.000Z'
                  attendanceSession: { id: attendance-session-123, status: CONNECTED }
                  providerSession: { id: provider-session-123, expiresAt: '2026-09-22T10:00:00.000Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            `PARTICIPANT_MISMATCH`, `INVITE_REVOKED`, `INVITE_EXPIRED`,
            `JOIN_WINDOW_NOT_OPEN`, `JOIN_WINDOW_CLOSED` or `CALL_CANCELLED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { description: '`INVITE_NOT_FOUND` — no invitation matches this token.' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: |
            `PROVIDER_UNAVAILABLE`. Authorization was valid; the media provider
            failed. No attendance session is created and the invitation is
            untouched, so a retry succeeds once the provider recovers.

  /api/v1/join/{token}/heartbeat:
    parameters: [{ $ref: '#/components/parameters/joinToken' }]
    post:
      tags: [Join]
      summary: Keep alive and revalidate
      description: |
        Re-runs the **entire** join authorization — user, invitation state,
        call state and time window — then refreshes session liveness.

        This is what makes revocation authoritative when realtime delivery
        fails: a revoked participant is denied here whether or not the socket
        event ever arrived.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string }
                deviceId: { type: string }
      responses:
        '200':
          description: Still authorized.
          content:
            application/json:
              example:
                data:
                  status: ACTIVE
                  sessionId: attendance-session-123
                  serverTime: '2026-09-22T09:31:00.000Z'
                  callEndsAt: '2026-09-22T10:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`INVITE_REVOKED`, `INVITE_EXPIRED`, `JOIN_WINDOW_CLOSED`, `CALL_CANCELLED`.' }
        '409': { description: No connected session to keep alive. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/join/{token}/leave:
    parameters: [{ $ref: '#/components/parameters/joinToken' }]
    post:
      tags: [Join]
      summary: Leave the call
      description: |
        Idempotent: the session is closed with a conditional update and totals
        are recomputed from the union of all sessions rather than incremented,
        so a repeated leave neither double-counts duration nor opens a session.

        Permitted even after revocation or window close — a participant must
        always be able to close out their own attendance — but ownership is
        still enforced.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string }
                deviceId: { type: string }
                reason: { type: string, enum: [USER_LEFT, TAB_CLOSED, NETWORK_LOST], default: USER_LEFT }
      responses:
        '200':
          description: Session closed, or already closed.
          content:
            application/json:
              example:
                data: { sessionId: attendance-session-123, status: COMPLETED, totalConnectedSeconds: 2400, alreadyLeft: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`PARTICIPANT_MISMATCH`.' }
        '404': { description: '`INVITE_NOT_FOUND`.' }

  /api/v1/calls/{callId}/attendance:
    parameters: [{ $ref: '#/components/parameters/callId' }]
    get:
      tags: [Attendance]
      summary: Attendance roster
      description: |
        **Authorization**: organizer only. A participant does not receive other
        participants' attendance.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: A page of attendance records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Attendance' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The caller is a participant, not the organizer. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/calls/{callId}/transcript:
    parameters: [{ $ref: '#/components/parameters/callId' }]
    get:
      tags: [Transcripts]
      summary: Read the transcript
      description: |
        **Authorization**: organizer **or** invited participant, decided by the
        caller's relationship to the call — never by the call ID alone. An
        unrelated caller gets the same 404 an unknown ID gets. Both outcomes
        are audited.
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Transcript' } }
              example:
                data: { callId: call_123, status: READY, content: '[00:00] Speaker 1: ...' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No such call, caller unrelated to it, or the transcript was deleted
            under the retention policy.
        '409': { description: '`TRANSCRIPT_NOT_READY` — still pending, processing or failed.' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/calls/{callId}/audit:
    parameters: [{ $ref: '#/components/parameters/callId' }]
    get:
      tags: [Audit]
      summary: Audit log for a call
      description: |
        **Authorization**: organizer only. Cursor paginated, newest first.
        Metadata is sanitized — no tokens, cookies, headers or transcript
        content. IP address and user agent are recorded but not serialized.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: A page of audit events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The caller is a participant, not the organizer. }
        '404': { $ref: '#/components/responses/NotFound' }
